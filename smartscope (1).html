<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smartscope – animated Generate</title>
<style>
  :root{--bg:#0a141b;--panel:#101e27;--line:#1c2f3b;--accent:#5ef2b0;--text:#cfe3ea;--dim:#6f8b97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  header{padding:14px 24px;border-bottom:1px solid var(--line);letter-spacing:.15em;font-weight:700}
  header small{color:var(--dim);font-weight:400;margin-left:12px}
  main{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:20px 24px;max-width:1400px;margin:auto}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
  h3{margin:0 0 14px;font-size:12px;letter-spacing:.15em;color:var(--dim);font-weight:500}
  .wf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .wf button{background:transparent;border:1px solid var(--line);color:var(--text);padding:10px;cursor:pointer;font:inherit;letter-spacing:.1em;font-size:11px}
  .wf button.on{border-color:var(--accent);color:var(--accent);background:rgba(94,242,176,.07)}
  .row{margin-bottom:14px}
  .row label{display:flex;justify-content:space-between;color:var(--dim);margin-bottom:4px}
  .row label b{color:var(--text);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .btns{display:flex;gap:8px;margin-top:18px}
  .btns button{height:46px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font:inherit;padding:0 16px}
  #gen{flex:1;background:var(--accent);color:#04231a;border-color:var(--accent);font-weight:700}
  #gen.running{background:transparent;color:var(--accent)}
  .bar{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:0 0 12px;color:var(--dim)}
  select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:5px 8px;font:inherit}
  .bar b{color:var(--accent)}
  .scope{position:relative;border:1px solid var(--line);background:#08121a}
  canvas{display:block;width:100%;height:430px}
  .foot{display:flex;justify-content:space-between;margin-top:10px;color:var(--dim);font-size:11px;letter-spacing:.08em}
  .live{color:var(--accent)}
</style>
</head>
<body>
<header>SMARTSCOPE <small>ESP32 SIGNAL LAB</small></header>
<main>
  <section class="panel">
    <h3>SIGNAL GENERATOR</h3>
    <div class="wf" id="wf"></div>

    <div class="row"><label>Frequency <b id="v-freq"></b></label>
      <input id="freq" type="range" min="1" max="3000" step="1" value="1990"></div>
    <div class="row"><label>Amplitude <b id="v-amp"></b></label>
      <input id="amp" type="range" min="0.2" max="6" step="0.1" value="2.4"></div>
    <div class="row"><label>DC offset <b id="v-dc"></b></label>
      <input id="dc" type="range" min="-3" max="3" step="0.1" value="0"></div>
    <div class="row"><label>Phase <b id="v-ph"></b></label>
      <input id="ph" type="range" min="0" max="360" step="1" value="0"></div>
    <div class="row"><label>Duty cycle <b id="v-duty"></b></label>
      <input id="duty" type="range" min="5" max="95" step="1" value="50"></div>
    <div class="row"><label>Slow-motion (visual) <b id="v-slow"></b></label>
      <input id="slow" type="range" min="0" max="2" step="0.01" value="0.1"></div>

    <div class="btns">
      <button id="gen">▶ Generate</button>
      <button id="stop" title="Stop">■</button>
      <button id="reset" title="Reset">↺</button>
    </div>
  </section>

  <section class="panel">
    <h3>WAVEFORM MONITOR <span id="state" style="float:right">IDLE</span></h3>
    <div class="bar">
      <span>TIME / DIV
        <select id="tdiv">
          <option value="0.05">50 µs</option><option value="0.1">100 µs</option>
          <option value="0.2">200 µs</option><option value="0.5">500 µs</option>
          <option value="1" selected>1 ms</option><option value="2">2 ms</option>
          <option value="5">5 ms</option><option value="10">10 ms</option>
        </select></span>
      <span>VOLTS / DIV
        <select id="vdiv">
          <option value="0.5">0.5 V</option><option value="1" selected>1 V</option>
          <option value="2">2 V</option><option value="5">5 V</option>
        </select></span>
      <span style="margin-left:auto"><b>CH1</b> ■</span>
    </div>
    <div class="scope"><canvas id="cv"></canvas></div>
    <div class="foot"><span id="legend"></span><span id="cycles"></span></div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const WAVES = ['SINE','SQUARE','TRIANGLE','SAWTOOTH','PULSE','NOISE'];

  // ---- state -------------------------------------------------------------
  const S = { wave:'SINE', running:false, anim:0 /* animated phase, in cycles */, raf:0, last:0 };

  // ---- waveform function: x = position in cycles (can be any real number) --
  function sample(x, duty){
    const f = x - Math.floor(x);                 // 0..1 within one cycle
    switch(S.wave){
      case 'SINE':     return Math.sin(2*Math.PI*f);
      case 'SQUARE':   return f < .5 ? 1 : -1;
      case 'TRIANGLE': return f < .25 ? 4*f : f < .75 ? 2-4*f : 4*f-4;
      case 'SAWTOOTH': return 2*f - 1;
      case 'PULSE':    return f < duty ? 1 : -1;
      case 'NOISE':    return Math.random()*2 - 1;
    }
  }

  // ---- read the controls ---------------------------------------------------
  function params(){
    return {
      freq: +$('freq').value,            // Hz
      amp:  +$('amp').value,             // Vpp
      dc:   +$('dc').value,
      phase:+$('ph').value / 360,        // cycles
      duty: +$('duty').value / 100,
      tdiv: +$('tdiv').value / 1000,     // seconds per division
      vdiv: +$('vdiv').value,
      slow: +$('slow').value             // visual slow-motion factor
    };
  }

  // ---- drawing -------------------------------------------------------------
  function resize(){
    const r = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w*r; cv.height = h*r; ctx.setTransform(r,0,0,r,0,0);
  }

  function draw(){
    const w = cv.clientWidth, h = cv.clientHeight, p = params();
    const DX = 10, DY = 8;
    ctx.clearRect(0,0,w,h);

    // grid
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(94,242,176,.10)';
    ctx.beginPath();
    for(let i=0;i<=DX;i++){ const x=Math.round(i*w/DX)+.5; ctx.moveTo(x,0); ctx.lineTo(x,h); }
    for(let j=0;j<=DY;j++){ const y=Math.round(j*h/DY)+.5; ctx.moveTo(0,y); ctx.lineTo(w,y); }
    ctx.stroke();
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(207,227,234,.35)';
    ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke(); ctx.setLineDash([]);

    // trace: time across the screen -> position in cycles.
    // THE ANIMATION: S.anim keeps growing, so the wave slides to the right.
    const windowT = p.tdiv * DX;                       // seconds on screen
    const cyclesOnScreen = p.freq * windowT;
    const pxPerVolt = (h/DY) / p.vdiv;
    const mid = h/2;

    ctx.beginPath();
    for(let px=0; px<=w; px++){
      const t = (px / w) * windowT;
      const pos = p.freq * t + p.phase - S.anim;       // minus => moves forward (right)
      const v = (p.amp/2) * sample(pos, p.duty) + p.dc;
      const y = mid - v * pxPerVolt;
      px === 0 ? ctx.moveTo(px,y) : ctx.lineTo(px,y);
    }
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(94,242,176,.9)'; ctx.shadowBlur = 12;
    ctx.strokeStyle = '#5ef2b0'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.shadowBlur = 0;

    $('cycles').textContent = `${Math.round(w)} SAMPLES · ${cyclesOnScreen.toFixed(1)} CYCLES`;
    $('legend').textContent = `${S.wave} / LIVE · ${p.freq} Hz`;
  }

  // ---- animation loop ------------------------------------------------------
  // Real time is far too fast to see (1990 Hz = 1990 cycles/s), so the phase advances at
  //     f * slow   cycles per real second.
  // Higher frequency => faster motion. slow just scales the speed so you can follow it.
  function frame(now){
    if(!S.running) return;
    const dt = Math.min((now - S.last)/1000, .1);      // clamp after tab switches
    S.last = now;
    const p = params();
    S.anim += p.freq * p.slow * dt / 100;              // see note: /100 => default (1990 Hz, 0.1x) drifts ~2 cycles per second
    draw();
    S.raf = requestAnimationFrame(frame);
  }

  function start(){
    if(S.running) return;
    S.running = true; S.last = performance.now();
    $('gen').classList.add('running'); $('gen').textContent = '● Running';
    $('state').textContent = 'RUNNING'; $('state').className = 'live';
    S.raf = requestAnimationFrame(frame);
  }
  function stop(){
    S.running = false; cancelAnimationFrame(S.raf);
    $('gen').classList.remove('running'); $('gen').textContent = '▶ Generate';
    $('state').textContent = 'STOPPED'; $('state').className = '';
    draw();
  }
  function reset(){
    stop(); S.anim = 0;
    $('freq').value=1990; $('amp').value=2.4; $('dc').value=0; $('ph').value=0; $('duty').value=50; $("slow").value=.1;
    labels(); draw(); $('state').textContent = 'IDLE';
  }

  // ---- UI ------------------------------------------------------------------
  function labels(){
    $('v-freq').textContent = $('freq').value + ' Hz';
    $('v-amp').textContent  = (+$('amp').value).toFixed(1) + ' Vpp';
    $('v-dc').textContent   = (+$('dc').value).toFixed(1) + ' V';
    $('v-ph').textContent   = $('ph').value + '°';
    $('v-duty').textContent = $('duty').value + '%';
    $('v-slow').textContent = (+$('slow').value).toFixed(2) + '×';
  }
  WAVES.forEach(n => {
    const b = document.createElement('button'); b.textContent = n; if(n===S.wave) b.className='on';
    b.onclick = () => { S.wave = n; [...$('wf').children].forEach(c => c.classList.toggle('on', c===b)); draw(); };
    $('wf').appendChild(b);
  });
  ['freq','amp','dc','ph','duty','slow','tdiv','vdiv'].forEach(id =>
    $(id).addEventListener('input', () => { labels(); if(!S.running) draw(); }));
  $('gen').onclick = () => S.running ? stop() : start();
  $('stop').onclick = stop;
  $('reset').onclick = reset;
  addEventListener('resize', () => { resize(); draw(); });

  labels(); resize(); draw();
})();
</script>
</body>
</html>
